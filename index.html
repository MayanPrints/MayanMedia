<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAYAN MEDIA</title>
<style>
/* ── RESET & BASE ── */
,::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{\n  --bg:#0A0A0F;--card:#13131A;--cardB:#1C1C26;--border:#252535;\n  --accent:#E8B84B;--accentS:rgba(232,184,75,.10);\n  --text:#F0EDE6;--muted:#6B6880;\n  --red:#E05252;--green:#4CC98A;--blue:#5B9BF0;--purple:#9B72F0;\n}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
body{display:flex;flex-direction:column}
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&display=swap');
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
input,textarea,select{background:var(--cardB);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;font-family:inherit;font-size:14px;outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
button{cursor:pointer;font-family:inherit;transition:all .2s;border:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500}

/* ── LOGIN INTERFACE ── */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:400px;padding:40px 32px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.login-logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--accent);text-align:center;margin-bottom:8px;letter-spacing:-0.5px}
.login-subtitle{color:var(--muted);font-size:14px;text-align:center;margin-bottom:32px}
.form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.form-group label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.btn-login{width:100%;background:var(--accent);color:var(--bg);padding:12px;font-weight:600;font-size:15px;margin-top:8px;box-shadow:0 4px 12px rgba(232,184,75,.2)}
.btn-login:hover{opacity:.9;transform:translateY(-1px)}
.btn-login:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;box-shadow:none}

/* ── APP SHELL ── */
.app-shell{display:none;height:100%;grid-template-columns:260px 1fr}
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 16px}
.sb-logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--accent);margin-bottom:32px;padding-left:12px}
.sb-menu{display:flex;flex-direction:column;gap:6px;flex:1}
.sb-item{padding:12px;color:var(--muted);text-decoration:none;border-radius:8px;font-size:14px;display:flex;align-items:center;gap:12px}
.sb-item:hover,.sb-item.active{color:var(--text);background:var(--cardB)}
.sb-item.active{border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding-left:9px}
.sb-user{border-top:1px solid var(--border);padding-top:16px;display:flex;align-items:center;justify-content:between;font-size:13px}
.logout-btn{background:transparent;color:var(--red);font-size:12px;padding:4px 8px}

.main-content{padding:40px;overflow-y:auto;background:var(--bg)}
.view-panel{display:none}
.view-panel.active{display:block}
</style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">MAYAN MEDIA</div>
    <div class="login-subtitle">Sistema Interno de Cotizaciones</div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="login-username">Usuario</label>
        <input type="text" id="login-username" required autocomplete="username" placeholder="Tu usuario">
      </div>
        <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" id="login-submit-btn" class="btn-login">Ingresar al Sistema</button>
    </form>
  </div>
</div>

<div id="app-shell" class="app-shell">
  <aside class="sidebar">
    <div class="sb-logo">MAYAN MEDIA</div>
    <nav class="sb-menu">
      <a href="#" class="sb-item active" data-view="clientes">Clientes</a>
      <a href="#" class="sb-item" data-view="cotizador">Nueva Cotización</a>
      <a href="#" class="sb-item" data-view="historial">Historial</a>
      <a href="#" class="sb-item" data-view="cola">Cola de Trabajo</a>
      <a href="#" class="sb-item" data-view="finanzas">Finanzas Globales</a>
    </nav>
    <div class="sb-user">
      <div>
        <div style="font-weight:600" id="user-display-name">Usuario</div>
        <div style="color:var(--muted);font-size:11px" id="user-display-role">Rol</div>
      </div>
      <button class="logout-btn" id="btn-logout">Salir</button>
    </div>
  </aside>

  <main class="main-content">
    <section id="view-clientes" class="view-panel active">
      <h2>Módulo de Clientes</h2>
      <p style="color:var(--muted); margin-top:8px;">Cargando base de datos...</p>
    </section>

    <section id="view-cotizador" class="view-panel">
      <h2>Generar Cotización</h2>
    </section>

    <section id="view-historial" class="view-panel">
      <h2>Historial de Ventas</h2>
    </section>

    <section id="view-cola" class="view-panel">
      <h2>Cola de Producción</h2>
    </section>

    <section id="view-finanzas" class="view-panel">
      <h2>Reporte Financiero</h2>
    </section>
  </main>
</div>

<script>
  // ==========================================
//  CONFIGURACIÓN DEL BACKEND (API_URL)
// ==========================================
// REEMPLAZA ESTA URL CON TU MACRO REAL COMPLETA DE APPS SCRIPT SI NO ES ESTA:
const API_URL = "https://script.google.com/macros/s/AKfycbwYnTai___6K7pz7e4amkoeLWSCZRb8MRGNDX4nGCQEOiBiOgGlyMlfUxD_BdtEOqk/exec";

// Elementos de la Interfaz
const loginScreen = document.getElementById('login-screen');
const appShell = document.getElementById('app-shell');
const loginForm = document.getElementById('login-form');
const loginSubmitBtn = document.getElementById('login-submit-btn');

// --- MANEJO DEL LOGIN CORREGIDO PARA GITHUB ---
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault(); // Detiene el envío estándar del formulario a GitHub

  const txtUsuario = document.getElementById('login-username').value.trim();
  const txtPassword = document.getElementById('login-password').value.trim();

  // Bloquear botón para dar feedback
  loginSubmitBtn.disabled = true;
  const originalText = loginSubmitBtn.innerHTML;
  loginSubmitBtn.innerHTML = 'Verificando credenciales...';

  try {
    // Petición POST asíncrona directa hacia Google Apps Script evadiendo GitHub Pages
    const response = await fetch(API_URL, {
      method: 'POST',
      mode: 'cors', 
      headers: {
        'Content-Type': 'text/plain;charset=utf-8' // Obliga a que no salte error de pre-vuelo (OPTIONS)
      },
      body: JSON.stringify({
        action: 'login',
        username: txtUsuario,
        password: txtPassword
      })
    });

    if (!response.ok) {
      throw new Error(Error en el servidor: ${response.status});
    }

    const data = await response.json();

    if (data.success) {
      // Guardar los datos en el navegador para mantener sesión activa si se recarga
      localStorage.setItem('mayan_session', JSON.stringify(data.user));
      initApp(data.user);
    } else {
      alert('Error: ' + (data.message || 'Contraseña o usuario incorrectos.'));
    }

  } catch (error) {
    console.error("Fallo de conexión:", error);
    alert('No se pudo conectar con el servidor central de Google Sheets. Verifica tu conexión a internet o la configuración del Script.');
  } finally {
    // Restaurar el botón
    loginSubmitBtn.innerHTML = originalText;
    loginSubmitBtn.disabled = false;
  }
});

// Inicializar Aplicación al Autenticarse
function initApp(user) {
  loginScreen.style.display = 'none';
  appShell.style.display = 'grid';
  
  document.getElementById('user-display-name').textContent = user.nombre || user.username;
  document.getElementById('user-display-role').textContent = user.rol || 'Operador';
  // Aquí puedes llamar a tus funciones para descargar clientes/cotizaciones de la hoja
  console.log("¡Sesión iniciada correctamente!", user);
}

// Cierre de Sesión
document.getElementById('btn-logout').addEventListener('click', () => {
  localStorage.removeItem('mayan_session');
  location.reload();
});

// Navegación Básica del Sidebar
document.querySelectorAll('.sb-item').forEach(item => {
  item.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
    document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
    
    item.classList.add('active');
    const targetView = item.getAttribute('data-view');
    document.getElementById(view-${targetView}).classList.add('active');
  });
});

// Verificar si ya había una sesión guardada previamente
window.addEventListener('DOMContentLoaded', () => {
  const savedSession = localStorage.getItem('mayan_session');
  if (savedSession) {
    try {
      const user = JSON.parse(savedSession);
      initApp(user);
    } catch(e) {
      localStorage.removeItem('mayan_session');
    }
  }
});
</script>
</body>
</html>
